# Publications, in the order shown, as a bullet list (none has a public
# link yet). Papers under review carry no venue name. Set "hidden: true"
# to keep an entry out of the page.
#
# Fields: title, authors (list; the owner's name is emboldened), meta
# (status line), summary (one sentence).

- title: "Beyond Accuracy and Calibration: Confidence Ranking Preservation and Routing Consistency for Fixed-budget Deferral in Quantized Edge AI"
  authors: [Kuan-Yu Liu, Chien-Yu Chen, Chiu-Han Hsiao]
  meta: "Under review, 2026 · first author"
  summary: "Routing-consistency metrics for fixed-budget deferral in quantized models: they catch deferred-set changes that accuracy and calibration miss (at 7 bits, ResNet-50’s deferred set overlaps the full-precision one with a Jaccard index of only 0.371)."

- title: "Beyond Global Rank Statistics: Localized Certification for Quantile-Thresholded Decision Systems"
  authors: [Chien-Yu Chen, Kuan-Yu Liu, Chiu-Han Hsiao]
  meta: "Under review, 2026 · second author"
  summary: "A local measure of rank movement near the operating quantile predicts selected-set churn far better than global rank statistics: R² = 0.968 against 0.655 in the small-perturbation regime."

- title: "Task-Aware Multi-Model Probability Fusion with Uncertainty-Guided Review for Reliable Liver Volumetry"
  authors: [Kuan-Yu Liu, Chia-Hsun Wu, Chiu-Han Hsiao]
  meta: "Under review, 2026 · first author"
  summary: "Task-aware fusion of four 2D, 2.5D and 3D U-Nets raises Dice to 0.9438 and cuts volume error from 101.6 to 69.7 mL; sending the riskiest 10% of predictions to clinicians cuts false negatives from 4.18% to 1.49%."

- title: "A Motor-Cognitive Performance Assessment System Based on Markerless Pose Estimation and Real-Time Computer Vision"
  authors: [Kuan-Hung Yeh, Lee-Xiang Lee, Chen-Kai Li, Shih-Lung Hsu, Kuan-Yu Liu, Chun-Hao Wang]
  meta: "Under review, 2026 · co-author"
  summary: "One camera measures reaction and movement time from video, with 42 ms latency, and resolves event times to within 59 ms."

- title: "Request First, Habit Second: Steering Next-POI Routes with Natural-Language Requests and Checked Explanations"
  authors: [Cheng-Ru Chou, Zong-Ze Cai, Ting-Hsuan Lin, Kuan-Yu Liu, Pei-Xuan Li, Shou-Po Tsai, Hsun-Ping Hsieh, I-Hsuan Yen]
  meta: "Demo paper, under review, 2026 · co-author"
  summary: "A map-centred next-POI route planner steered by natural-language requests, with a verifier that checks every sentence of the explanation against the evidence behind each stop and removes 99.96% of planted errors."

